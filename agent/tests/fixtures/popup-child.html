<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fixture popup</title>
  </head>
  <body>
    <script>
      // Sends its hit, then closes itself: the hit outlives the tab only if the whole browser is heard.
      fetch("/g/collect?v=2&tid=G-1&en=view_item", { method: "POST", keepalive: true }).finally(() =>
        setTimeout(() => window.close(), 300),
      );
    </script>
  </body>
</html>
