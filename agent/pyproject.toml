[project]
name = "argos-agent"
version = "0.1.0"
description = "Runs pixel-code test scenarios through Playwright MCP"
requires-python = ">=3.12"
dependencies = ["fastmcp==3.4.7", "jsonschema==4.26.0"]

[project.scripts]
argos-runner = "argos_agent.run:main"
argos-tool-catalog-updater = "argos_agent.playwright_mcp.refresh:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["argos_agent*"]

[tool.setuptools.package-data]
"argos_agent" = ["data/*.json"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["argos_agent"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: no browser, no network",
    "integration: starts the pinned Playwright MCP server or reads playwright.dev",
]
